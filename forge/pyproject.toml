[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studioforge"
version = "0.1.0"
description = "Claude Code + deterministic EDA pipelines: prompt -> system plan -> boards -> fab files -> purchasing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "gerbonara", "kiutils"]
anthropic = ["anthropic"]

[project.scripts]
forge = "studioforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
